<section
  id="terminal"
  class="scroll-mt-24 bg-emerald-900 rounded-none md:rounded-3xl shadow-sm border border-emerald-800 text-center relative overflow-hidden p-2 sm:p-4 md:p-8"
>
  <div
    class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent"
  ></div>
  <h2
    class="text-xl sm:text-2xl font-bold text-amber-300 relative z-10 mb-2 sm:mb-4"
  >
    Terminale di Ricerca
  </h2>
  <p
    class="text-emerald-100 relative z-10 max-w-lg mx-auto mb-2 sm:mb-4 md:mb-6 text-sm sm:text-base"
  >
    Simula la fine della sessione di ricerca nel terminale dell'Atlante. Un
    avviso chiederà di confermare la presenza.
  </p>

  <button
    (click)="popupOpened.emit()"
    class="relative z-10 w-full sm:w-auto px-2 py-2 sm:px-6 sm:py-2.5 md:px-8 md:py-3 bg-amber-500 text-stone-900 dark:text-stone-900 rounded-xl font-bold cursor-pointer hover:bg-amber-400 focus:outline-none shadow-lg transition-all"
  >
    Simula Fine Sessione
  </button>
</section>
