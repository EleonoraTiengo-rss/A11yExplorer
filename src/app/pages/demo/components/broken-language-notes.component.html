<section
  id="language"
  class="@container scroll-mt-24 bg-white rounded-none md:rounded-3xl shadow-sm border border-stone-200 p-2 sm:p-4 md:p-8"
>
  <h2
    class="text-xl sm:text-2xl font-bold text-stone-800 mb-2 sm:mb-4 md:mb-6"
  >
    Note di Ricerca (Giappone)
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 items-start gap-2 sm:gap-4 md:gap-6">
    @for (card of cards; track card.id) {
      <section
        [id]="card.id"
        class="@container flex flex-col bg-white rounded-none md:rounded-2xl shadow-sm border border-stone-200 p-2 sm:p-4 md:p-5"
      >
        <h3
          class="text-lg font-bold text-stone-800 pb-2 mb-3 sm:mb-4 border-b border-stone-200"
        >
          {{ card.title }}
        </h3>
        <div
          class="flex flex-col flex-wrap gap-3 sm:gap-4 overflow-x-auto"
          [class]="card.isRightToLeft ? '[writing-mode:vertical-rl]' : ''"
        >
          <p
            class="m-0 text-base leading-7 text-left text-stone-700 border-l-4 border-emerald-600 pl-3 shrink-0 max-w-80 max-h-80"
          >
            {{ card.text }}
          </p>
          <img
            src="assets/images/background-cards.jpg"
            [alt]="card.imageAlt"
            class="max-w-[min(100%,18rem)] max-h-36 min-h-16 self-start rounded-lg border border-stone-200 bg-stone-50"
          />
        </div>
      </section>
    }
  </div>
</section>
