<section id="language" class="language-section">
  <h2 class="section-title">
    <mat-icon class="section-icon">translate</mat-icon> Note di Ricerca
    (Giappone)
  </h2>

  <div class="content-wrapper">
    @for (card of cards; track card.id) {
      <section [id]="card.id" class="card">
        <h3 class="card-title">{{ card.title }}</h3>
        <div class="note" [lang]="card.lang">
          <p class="note-text">
            {{ card.text }}
          </p>
          <img
            src="assets/images/background-cards.jpg"
            [alt]="card.imageAlt"
            class="note-img"
          />
        </div>
      </section>
    }
  </div>
</section>
