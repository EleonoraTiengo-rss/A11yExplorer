<section
  id="language"
  class="@container scroll-mbs-24 bg-white dark:bg-stone-900 rounded-none md:rounded-3xl shadow-sm border border-stone-200 dark:border-stone-800 p-2 sm:p-4 md:p-8"
>
  <h2
    class="text-xl sm:text-2xl font-bold text-stone-800 dark:text-stone-100 mbe-2 sm:mbe-4 md:mbe-6"
  >
    Note di Ricerca (Giappone)
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 items-start gap-2 sm:gap-4 md:gap-6">
    @for (card of cards; track card.id) {
      <section
        [id]="card.id"
        class="@container flex flex-col bg-white dark:bg-stone-950 rounded-none md:rounded-2xl shadow-sm border border-stone-200 dark:border-stone-800 p-2 sm:p-4 md:p-5"
      >
        <h3
          class="text-lg font-bold text-stone-800 dark:text-stone-100 pbe-2 mbe-3 sm:mbe-4 border-be border-stone-200 dark:border-stone-800"
        >
          {{ card.title }}
        </h3>
        <div
          class="flex flex-col flex-wrap gap-3 sm:gap-4 overflow-x-auto"
          [class]="card.isRightToLeft ? '[writing-mode:vertical-rl]' : ''"
          [lang]="card.lang"
        >
          <p
            class="m-0 text-base leading-7 text-start text-stone-700 dark:text-stone-200 border-s-4 border-emerald-600 dark:border-emerald-400 ps-3 shrink-0 max-inline-80"
          >
            {{ card.text }}
          </p>
          <img
            src="assets/images/background-cards.jpg"
            [alt]="card.imageAlt"
            class="max-inline-[min(100%,18rem)] max-block-36 min-block-16 self-start rounded-lg border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800"
          />
        </div>
      </section>
    }
  </div>
</section>
