<section
  id="species"
  class="scroll-mt-24 bg-white rounded-3xl shadow-sm border border-stone-200"
  style="padding-block: 2rem; padding-inline: 2rem"
>
  <h2
    class="text-2xl font-bold text-stone-800"
    style="margin-block-end: 1.5rem"
  >
    Appunti di Campo: Specie Endemiche
  </h2>
  <div class="space-y-4">
    @for (note of notes; track note.id) {
      <details
        class="group bg-stone-50 rounded-2xl border border-stone-200 overflow-visible"
      >
        <summary
          class="font-semibold text-lg text-stone-800 cursor-pointer hover:bg-stone-100 flex justify-between items-center rounded-2xl group-open:rounded-b-none"
          style="padding-block: 1.25rem; padding-inline: 1.25rem"
        >
          {{ note.title }}
          <mat-icon
            class="text-stone-600 group-open:rotate-180 transition-transform"
            >expand_more</mat-icon
          >
        </summary>
        <div
          class="border-t border-stone-200 text-stone-600 bg-white leading-relaxed rounded-b-2xl"
          style="padding-block: 1.25rem; padding-inline: 1.25rem"
        >
          {{ note.content }}
          <div style="margin-block-start: 1rem">
            <button
              type="button"
              (click)="onScrollTo(note.targetId)"
              class="inline-flex items-center gap-1 text-emerald-700 font-medium cursor-pointer hover:text-emerald-800 hover:underline rounded transition-colors"
              style="
                padding-block: 0.25rem;
                padding-inline: 0.5rem;
                margin-inline-start: -0.5rem;
              "
            >
              <mat-icon class="text-sm w-4 h-4">menu_book</mat-icon> Apri scheda
              Pokédex
            </button>
          </div>
        </div>
      </details>
    }
  </div>
</section>
