<section
  id="species"
  class="scroll-mt-24 bg-white dark:bg-stone-900 rounded-none md:rounded-3xl shadow-sm border border-stone-200 dark:border-stone-800 p-2 sm:p-4 md:p-8"
>
  <h2
    class="text-xl sm:text-2xl font-bold text-stone-800 dark:text-stone-100 mb-2 sm:mb-4 md:mb-6"
  >
    Appunti di Campo: Specie Endemiche
  </h2>
  <div class="space-y-2 sm:space-y-4">
    @for (note of notes; track note.id) {
      <details
        class="group bg-stone-50 dark:bg-stone-950 rounded-xl sm:rounded-2xl border border-stone-200 dark:border-stone-800 overflow-visible"
      >
        <summary
          class="font-semibold text-base sm:text-lg text-stone-800 dark:text-stone-200 cursor-pointer hover:bg-stone-100 dark:hover:bg-stone-900 flex justify-between items-center rounded-xl sm:rounded-2xl group-open:rounded-b-none p-2 sm:p-3.5 md:p-5"
        >
          {{ note.title }}
          <mat-icon
            class="text-stone-600 dark:text-stone-400 group-open:rotate-180 transition-transform"
            >expand_more</mat-icon
          >
        </summary>
        <div
          class="border-t border-stone-200 dark:border-stone-800 text-stone-600 dark:text-stone-300 bg-white dark:bg-stone-900 leading-relaxed rounded-b-xl sm:rounded-b-2xl p-2 sm:p-3.5 md:p-5"
        >
          {{ note.content }}
          <div class="mt-2 sm:mt-4">
            <button
              type="button"
              (click)="onScrollTo(note.targetId)"
              class="inline-flex items-center gap-1 text-emerald-700 dark:text-emerald-400 font-medium cursor-pointer hover:text-emerald-800 dark:hover:text-emerald-300 hover:underline rounded transition-colors py-1 px-2 -ml-2"
            >
              <mat-icon class="text-sm w-4 h-4">menu_book</mat-icon> Apri scheda
              Pokédex
            </button>
          </div>
        </div>
      </details>
    }
  </div>
</section>
