<div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
  <button
    type="button"
    (click)="throwBall()"
    class="w-full sm:w-auto justify-center px-2 py-2 sm:px-5 sm:py-2.5 md:px-6 md:py-3 bg-red-700 text-white rounded-xl font-medium cursor-pointer hover:bg-red-800 transition-all flex items-center gap-2 shadow-sm"
  >
    <mat-icon class="text-sm w-5 h-5" aria-hidden="true">catching_pokemon</mat-icon>
    Lancia Poké Ball
  </button>
  <p role="status" class="text-stone-700 dark:text-stone-300 text-base sm:text-lg m-0">{{ message() }}</p>
</div>
