@if (showPopup()) {
  <div
    id="alertdialog-overlay"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6"
  >
    <div
      id="alertdialog-backdrop"
      aria-hidden="true"
      class="fixed inset-0 bg-[#1c1917]/70 backdrop-blur-md transition-opacity duration-200"
    ></div>

    <div
      #accessiblePopup
      id="accessible-alert-popup"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="popup-title"
      aria-describedby="popup-desc"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      class="relative z-20 bg-white rounded-[24px] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.25)] max-w-[480px] w-full border border-black/5 outline-none p-8 sm:p-10 flex flex-col gap-6 animate-in"
      tabindex="-1"
    >
      <div class="flex items-center gap-4">
        <div
          class="w-10 h-10 rounded-xl bg-red-100 text-red-600 flex items-center justify-center shrink-0"
          aria-hidden="true"
        >
          <mat-icon class="text-2xl leading-none">warning</mat-icon>
        </div>
        <h2
          id="popup-title"
          class="text-2xl font-bold text-[#1c1917] tracking-tight m-0"
        >
          Disconnessione Imminente
        </h2>
      </div>

      <p id="popup-desc" class="text-[#57534e] text-base leading-[1.6] m-0">
        La sessione del terminale terminerà se non confermi la tua presenza.
      </p>

      <div
        class="bg-[#fafaf9] border border-[#e7e5e4] rounded-2xl p-5 flex flex-col gap-3"
      >
        <div class="flex justify-between items-center text-sm font-semibold">
          <span id="countdown-label" class="text-[#57534e]"
            >Tempo rimanente</span
          >
          <span
            id="countdown-seconds"
            class="font-semibold tabular-nums text-red-600"
          >
            {{ timeLeft() }} secondi
          </span>
        </div>

        <div
          id="countdown-progressbar"
          class="w-full bg-[#e5e7eb] rounded-full h-2.5 overflow-hidden border border-stone-300"
          role="progressbar"
          [attr.aria-valuenow]="timeLeft()"
          aria-valuemin="0"
          [attr.aria-valuemax]="initialSeconds()"
          aria-labelledby="countdown-label"
        >
          <div
            class="progress-bar-fill h-full rounded-full bg-red-600 transition-all duration-1000 ease-linear"
            [style.width.%]="progressPercentage()"
          ></div>
        </div>
      </div>

      <div
        id="sr-announcement"
        aria-live="polite"
        aria-atomic="true"
        class="sr-only"
      >
        {{ announcementText() }}
      </div>

      <div class="flex items-center justify-end gap-3 mt-2">
        <button
          #cancelButton
          id="alert-btn-cancel"
          type="button"
          (click)="onCancel()"
          class="px-6 py-3.5 text-[#57534e] hover:text-[#1c1917] hover:bg-stone-100 active:bg-stone-200 rounded-xl text-[15px] font-semibold cursor-pointer focus-visible:ring-2 focus-visible:ring-stone-400 focus-visible:outline-none transition-all text-center"
        >
          Esci
        </button>
        <button
          #confirmButton
          id="alert-btn-confirm"
          type="button"
          (click)="onConfirm()"
          class="px-6 py-3.5 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white rounded-xl text-[15px] font-semibold cursor-pointer shadow-[0_4px_6px_-1px_rgba(220,38,38,0.2)] hover:shadow-md focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2 focus-visible:outline-none transition-all text-center"
        >
          Resta connesso
        </button>
      </div>
    </div>
  </div>
}
