<section class="bg-white dark:bg-stone-900 rounded-none md:rounded-3xl shadow-sm border border-stone-200 dark:border-stone-800 relative overflow-hidden p-2 sm:p-4 md:p-8">
  <div class="hidden sm:block absolute w-64 h-64 bg-emerald-50 dark:bg-emerald-950/20 rounded-full blur-3xl opacity-50 pointer-events-none -top-20 -right-20"></div>
  
  <div class="flex flex-col md:flex-row gap-2 sm:gap-4 md:gap-8 items-center relative z-10">
    <div class="flex-1 w-full min-w-0">
      <h2 class="text-xl sm:text-2xl font-bold text-stone-800 dark:text-stone-100 mb-2 sm:mb-4">Laboratorio di Ricerca Pokémon</h2>
      <p class="text-stone-600 dark:text-stone-300 leading-relaxed text-base sm:text-lg mb-2 sm:mb-4 md:mb-6">
        Benvenuto nel laboratorio centrale, Allenatore! Da qui coordiniamo tutte le nostre spedizioni. 
        Oggi ci concentreremo sullo studio degli ecosistemi e sulla catalogazione di nuove specie. 
        Scegli un'attività per iniziare la tua ricerca sul campo.
      </p>
      <div class="flex flex-col sm:flex-row flex-wrap gap-2 sm:gap-4">
        <button (click)="scrollToRequested.emit({id: 'habitat'})" class="w-full sm:w-auto justify-center sm:justify-start px-2 py-2 sm:px-5 sm:py-2.5 md:px-6 md:py-3 bg-emerald-700 text-white rounded-xl font-medium cursor-pointer hover:bg-emerald-800 focus:outline-none transition-all flex items-center gap-2 shadow-sm">
          <mat-icon class="text-sm w-5 h-5">landscape</mat-icon>
          Esplora Habitat
        </button>
        <button (click)="scrollToRequested.emit({id: 'species'})" class="w-full sm:w-auto justify-center sm:justify-start px-2 py-2 sm:px-5 sm:py-2.5 md:px-6 md:py-3 bg-amber-500 text-stone-900 dark:text-stone-900 rounded-xl font-medium cursor-pointer hover:bg-amber-600 focus:outline-none transition-all flex items-center gap-2 shadow-sm">
          <mat-icon class="text-sm w-5 h-5 text-stone-900">menu_book</mat-icon>
          Consulta Appunti
        </button>
        <button (click)="scrollToRequested.emit({id: 'report'})" class="w-full sm:w-auto justify-center sm:justify-start px-2 py-2 sm:px-5 sm:py-2.5 md:px-6 md:py-3 bg-red-700 text-white rounded-xl font-medium cursor-pointer hover:bg-red-800 focus:outline-none transition-all flex items-center gap-2 shadow-sm">
          <mat-icon class="text-sm w-5 h-5">campaign</mat-icon>
          Segnala Avvistamento
        </button>
      </div>
    </div>
    <div class="w-full md:w-1/3 shrink-0 flex justify-center my-2 sm:my-0">
      <img src="assets/images/pokemon-133.png" 
           role="presentation"
           alt="" 
           class="w-full max-w-[240px] md:max-w-none h-auto object-contain drop-shadow-xl">
    </div>
  </div>
</section>
