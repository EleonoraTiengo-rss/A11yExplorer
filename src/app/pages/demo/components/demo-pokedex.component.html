<section
  id="pokedex-section"
  class="max-w-5xl mx-auto px-4"
  style="margin-block-start: 1.5rem; margin-block-end: 1.5rem"
>
  <h2
    class="text-2xl font-bold text-stone-800"
    style="margin-block-end: 1.5rem"
  >
    Dati Pokédex
  </h2>

  @for (pokemon of pokemonList; track pokemon.id) {
    <article
      [id]="pokemon.id"
      class="scroll-mt-24 flex flex-col md:flex-row gap-6 items-center bg-white rounded-3xl border border-stone-200 shadow-sm"
      style="
        padding-block: 1.5rem;
        padding-inline: 1.5rem;
        margin-block-end: 1.5rem;
      "
    >
      <div
        class="w-48 h-48 bg-stone-50 rounded-2xl border border-stone-100 flex items-center justify-center shrink-0"
        style="padding-block: 1rem; padding-inline: 1rem"
      >
        <img
          [src]="pokemon.image"
          [alt]="pokemon.alt"
          class="w-full h-full object-contain drop-shadow-lg hover:scale-110 transition-transform"
        />
      </div>

      <div class="flex-1 w-full">
        <div class="flex items-center gap-3" style="margin-block-end: 0.5rem">
          <h3 class="text-2xl font-bold" [class]="pokemon.nameColorClass">
            {{ pokemon.name }}
          </h3>
          <div class="text-stone-600 font-mono font-bold">
            <span class="sr-only"
              >Numero pokédex: {{ pokemon.pokedexNumber }}</span
            >
            <span aria-hidden="true">{{ pokemon.formattedNumber }}</span>
          </div>
        </div>

        <p
          class="text-stone-600 leading-relaxed"
          style="margin-block-end: 1rem"
        >
          {{ pokemon.description }}
        </p>

        <ul
          [attr.aria-label]="pokemon.name + ' è di tipo:'"
          class="flex gap-2 p-0 m-0 list-none"
        >
          @for (type of pokemon.types; track type.name) {
            <li
              class="px-3 py-1 text-sm font-bold rounded-full border"
              [class]="
                type.bgClass + ' ' + type.textClass + ' ' + type.borderClass
              "
            >
              {{ type.name }}
            </li>
          }
        </ul>
      </div>
    </article>
  }
</section>
