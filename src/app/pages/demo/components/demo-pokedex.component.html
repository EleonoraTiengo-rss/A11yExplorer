<section
  id="pokedex-section"
  class="max-w-5xl mx-auto my-2 sm:my-4 md:my-6"
>
  <h2
    class="text-xl sm:text-2xl font-bold text-stone-800 dark:text-stone-100 mb-2 sm:mb-4 md:mb-6"
  >
    Dati Pokédex
  </h2>

  @for (pokemon of pokemonList; track pokemon.id) {
    <article
      [id]="pokemon.id"
      class="scroll-mt-24 flex flex-col md:flex-row gap-2 sm:gap-4 md:gap-6 items-center bg-white dark:bg-stone-900 rounded-2xl sm:rounded-3xl border border-stone-200 dark:border-stone-800 shadow-sm p-2 sm:p-4 md:p-6 mb-2 sm:mb-4 md:mb-6"
    >
      <div
        class="w-36 h-36 sm:w-48 sm:h-48 bg-stone-50 dark:bg-stone-950 rounded-xl sm:rounded-2xl border border-stone-100 dark:border-stone-800 flex items-center justify-center shrink-0 p-2 sm:p-3 md:p-4"
      >
        <img
          [src]="pokemon.image"
          [alt]="pokemon.alt"
          class="w-full h-full object-contain drop-shadow-lg hover:scale-110 transition-transform"
        />
      </div>

      <div class="flex-1 w-full min-w-0">
        <div class="flex items-center gap-2 sm:gap-3 mb-2">
          <h3 class="text-xl sm:text-2xl font-bold" [class]="pokemon.nameColorClass">
            {{ pokemon.name }}
          </h3>
          <div class="text-stone-600 dark:text-stone-400 font-mono font-bold text-sm sm:text-base">
            <span class="sr-only"
              >Numero pokédex: {{ pokemon.pokedexNumber }}</span
            >
            <span aria-hidden="true">{{ pokemon.formattedNumber }}</span>
          </div>
        </div>

        <p
          class="text-stone-600 dark:text-stone-300 leading-relaxed mb-2 sm:mb-4 text-sm sm:text-base"
        >
          {{ pokemon.description }}
        </p>

        <ul
          [attr.aria-label]="pokemon.name + ' è di tipo:'"
          class="flex flex-wrap gap-2 p-0 m-0 list-none"
        >
          @for (type of pokemon.types; track type.name) {
            <li
              class="px-2 sm:px-3 py-1 text-sm font-bold rounded-full border transition-colors"
              [class]="
                type.bgClass + ' ' + type.textClass + ' ' + type.borderClass
              "
            >
              {{ type.name }}
            </li>
          }
        </ul>
      </div>
    </article>
  }
</section>
