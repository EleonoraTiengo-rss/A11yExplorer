<div
  class="min-h-screen bg-stone-100 font-sans pb-20 transition-colors"
  [class.dark:bg-[#0c0a09]]="isAccessible()"
  [class.not-accessible-mode]="!isAccessible()"
>
  <main>
    <app-demo-header
      (accessibilityToggled)="toggleAccessibility($event)"
    ></app-demo-header>

    <div class="w-full max-w-4xl mx-auto px-2 sm:px-4 py-0 md:p-6 my-2 sm:my-4 md:my-8 space-y-2 sm:space-y-6 md:space-y-12">
      @if (isAccessible()) {
        <app-demo-hero-nav
          (scrollToRequested)="scrollTo($event)"
        ></app-demo-hero-nav>
        <app-demo-hero></app-demo-hero>
      } @else {
        <div class="flex flex-col gap-2 sm:gap-6 md:gap-12">
          <app-broken-hero></app-broken-hero>
          <app-broken-hero-nav
            class="order-first"
            (scrollToRequested)="scrollTo($event)"
          ></app-broken-hero-nav>
        </div>
      }

      @if (isAccessible()) {
        <app-demo-habitat></app-demo-habitat>
      } @else {
        <app-broken-habitat></app-broken-habitat>
      }

      @if (isAccessible()) {
        <app-demo-species
          (scrollToRequested)="scrollTo($event)"
        ></app-demo-species>
      } @else {
        <app-broken-species
          [openPanel]="openPanel()"
          (panelToggled)="togglePanel($event)"
          (scrollToRequested)="scrollTo($event)"
        >
        </app-broken-species>
      }

      @if (isAccessible()) {
        <app-demo-pokedex></app-demo-pokedex>
      } @else {
        <app-broken-pokedex></app-broken-pokedex>
      }

      @if (isAccessible()) {
        <app-demo-language-notes></app-demo-language-notes>
      } @else {
        <app-broken-language-notes></app-broken-language-notes>
      }

      @if (isAccessible()) {
        <app-demo-report-form
          [isSubmitted]="isSubmitted()"
          (formSubmitted)="submitForm()"
        >
        </app-demo-report-form>
      } @else {
        <app-broken-report-form
          [isSubmitted]="isSubmitted()"
          [isUrgent]="isUrgent()"
          (urgentToggled)="toggleUrgent()"
          (formSubmitted)="submitForm()"
        >
        </app-broken-report-form>
      }

      @if (isAccessible()) {
        <app-demo-terminal (popupOpened)="openPopup()"></app-demo-terminal>
      } @else {
        <app-broken-terminal (popupOpened)="openPopup()"></app-broken-terminal>
      }
    </div>
  </main>

  @if (isAccessible()) {
    <app-demo-popup [showPopup]="showPopup()" (popupClosed)="closePopup()">
    </app-demo-popup>
  } @else {
    <app-broken-popup [showPopup]="showPopup()" (popupClosed)="closePopup()">
    </app-broken-popup>
  }
</div>
