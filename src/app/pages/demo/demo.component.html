<div class="min-h-screen bg-stone-100 font-sans pb-20">
  
  <app-demo-header
    [isAccessible]="isAccessible()"
    (accessibilityToggled)="toggleAccessibility()">
  </app-demo-header>

  <main class="max-w-4xl mx-auto p-6 mt-8 space-y-12">
    
    <app-demo-hero
      [isAccessible]="isAccessible()"
      (scrollToRequested)="scrollTo($event)">
    </app-demo-hero>

    <app-demo-habitat
      [isAccessible]="isAccessible()">
    </app-demo-habitat>

    <app-demo-species
      [isAccessible]="isAccessible()"
      [openPanel]="openPanel()"
      (panelToggled)="togglePanel($event)"
      (scrollToRequested)="scrollTo($event)">
    </app-demo-species>

    <app-demo-pokedex
      [isAccessible]="isAccessible()">
    </app-demo-pokedex>

    <app-demo-report-form
      [isAccessible]="isAccessible()"
      [isSubmitted]="isSubmitted()"
      [isUrgent]="isUrgent()"
      (urgentToggled)="toggleUrgent()"
      (formSubmitted)="submitForm()">
    </app-demo-report-form>

    <app-demo-terminal
      [isAccessible]="isAccessible()"
      (popupOpened)="openPopup()">
    </app-demo-terminal>

  </main>

  <app-demo-popup
    [showPopup]="showPopup()"
    [isAccessible]="isAccessible()"
    [timeLeft]="timeLeft()"
    (popupClosed)="closePopup()">
  </app-demo-popup>

</div>
